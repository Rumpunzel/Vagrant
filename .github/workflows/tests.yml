name: Unit tests

# Lint + unit tests on every push. Waiting / UI tests live in integration_tests.yml

# Pushes cover the commits of pull requests too, so there is no separate pull_request trigger
on:
  push:
  workflow_dispatch:

# A newer push to the same branch cancels the run still in progress
concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The test report is published as a check run
  checks: write

jobs:
  lint:
    name: gdlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Pinned so new lint rules don't break the build unannounced; config in gdlintrc
      - run: pip install gdtoolkit==4.5.0
      - run: gdlint .

  gdunit:
    name: gdUnit4 (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: godot-gdunit-labs/gdUnit4-action@v1
        with:
          # Keep in sync with config/features in project.godot
          godot-version: '4.6'
          paths: 'res://tests/unit'
          # Use the gdUnit4 copy in addons/ instead of downloading another version
          version: 'installed'
          timeout: 10
          # Unique per workflow, or the reports overwrite each other's check run
          report-name: 'unit-tests.xml'
